# ddcoz lock screen v2: stacked clock on the left, underline password at the bottom.
# __WALLPAPER__ is filled in by ddcoz-lock with the current wallpaper.
general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = soft, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 6, soft
    animation = fadeOut, 1, 3, soft
    animation = inputFieldDots, 1, 2, soft
    animation = inputFieldColors, 1, 3, soft
}

background {
    monitor =
    path = __WALLPAPER__
    blur_passes = 2
    blur_size = 5
    brightness = 0.5
    contrast = 0.95
    vibrancy = 0.2
    noise = 0.015
}

# soft dark band on the left so the clock always reads
shape {
    monitor =
    size = 760, 1200
    color = rgba(8, 9, 14, 0.38)
    rounding = 0
    border_size = 0
    position = 0, 0
    halign = left
    valign = center
}

# accent line
shape {
    monitor =
    size = 3, 150
    color = rgba(124, 156, 255, 0.95)
    rounding = -1
    border_size = 0
    position = 120, 255
    halign = left
    valign = center
}

# date, small and spaced
label {
    monitor =
    text = cmd[update:30000] date +'%A  ·  %-d %B' | tr '[:lower:]' '[:upper:]' | sed 's/./& /g'
    color = rgba(255, 255, 255, 0.6)
    font_size = 13
    font_family = Inter SemiBold
    position = 150, 322
    halign = left
    valign = center
}

# hours
label {
    monitor =
    text = cmd[update:1000] date +'%H'
    color = rgba(255, 255, 255, 0.96)
    font_size = 190
    font_family = Inter Bold
    position = 138, 215
    halign = left
    valign = center
}

# minutes
label {
    monitor =
    text = cmd[update:1000] date +'%M'
    color = rgba(255, 255, 255, 0.34)
    font_size = 190
    font_family = Inter Bold
    position = 138, -10
    halign = left
    valign = center
}

# user
label {
    monitor =
    text = cmd[update:60000] h=$(date +%H); if [ $h -lt 6 ]; then g="good night"; elif [ $h -lt 12 ]; then g="good morning"; elif [ $h -lt 18 ]; then g="good afternoon"; else g="good evening"; fi; echo "$g, $USER"
    color = rgba(255, 255, 255, 0.55)
    font_size = 14
    font_family = Inter Medium
    position = 0, 128
    halign = center
    valign = bottom
}

# password: just an underline
input-field {
    monitor =
    size = 300, 44
    outline_thickness = 0
    dots_size = 0.28
    dots_spacing = 0.5
    dots_center = true
    dots_rounding = -1
    inner_color = rgba(255, 255, 255, 0.0)
    outer_color = rgba(255, 255, 255, 0.0)
    font_color = rgb(255, 255, 255)
    font_family = Inter Medium
    check_color = rgba(124, 156, 255, 0.9)
    fail_color = rgba(255, 107, 107, 0.9)
    capslock_color = rgba(255, 214, 10, 0.9)
    fade_on_empty = false
    rounding = 0
    placeholder_text = <span foreground="##ffffff77">enter password</span>
    fail_text = <span foreground="##ff8a8a">wrong password  ($ATTEMPTS)</span>
    hide_input = false
    position = 0, 70
    halign = center
    valign = bottom
}

# the underline under the field
shape {
    monitor =
    size = 300, 2
    color = rgba(255, 255, 255, 0.35)
    rounding = -1
    border_size = 0
    position = 0, 64
    halign = center
    valign = bottom
}

# battery, bottom right
label {
    monitor =
    text = cmd[update:30000] b=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1); [ -n "$b" ] && echo "$b%"
    color = rgba(255, 255, 255, 0.55)
    font_size = 13
    font_family = Inter Medium
    position = -32, 28
    halign = right
    valign = bottom
}
